services:
  db:
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    restart: "no"

  app:
    build:
      target: dev
    command: ["npm", "run", "dev:docker"]
    environment:
      APP_ENV: development
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "${APP_PORT:-3000}:3000"
    restart: "no"
    stdin_open: true
    tty: true

# ==============================================================================
# 🚀 [PROD] Production overlay
# ------------------------------------------------------------------------------
# Hardened: the database is never published, containers restart always, writes
# are confined to tmpfs, and privilege escalation is blocked.
#
# Put this behind a reverse proxy (nginx/Traefik) for TLS and rate limiting —
# the Next.js docs recommend not exposing the server directly.
#
#   make prod-up       build and start
#   make prod-deploy   pull → build → migrate → up → status
# ==============================================================================
services:
  db:
    # deliberately no `ports`: only the app network reaches Postgres
    restart: always
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  app:
    build:
      target: runner
    image: ${IMAGE_NAME:-finance-tracker}:${IMAGE_TAG:-latest}
    environment:
      APP_ENV: production
      NODE_ENV: production
    ports:
      - "${APP_PORT:-3000}:3000"
    restart: always
    stop_grace_period: 20s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          memory: 256M
    security_opt:
      - no-new-privileges:true
    # the standalone server only needs scratch space for temp files
    tmpfs:
      - /tmp
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

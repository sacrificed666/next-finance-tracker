services:
  db:
    restart: always
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  app:
    build:
      target: runner
    image: ${IMAGE_NAME:-finance-tracker}:${IMAGE_TAG:-latest}
    environment:
      APP_ENV: production
      NODE_ENV: production
    ports:
      - "${APP_PORT:-3000}:3000"
    restart: always
    stop_grace_period: 20s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          memory: 256M
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  backup:
    image: postgres:18-alpine
    entrypoint: ["/bin/sh", "/usr/local/bin/backup.sh"]
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-finance}
      PGPASSWORD: ${POSTGRES_PASSWORD:-finance}
      PGDATABASE: ${POSTGRES_DB:-finance_tracker}
      BACKUP_HOUR: ${BACKUP_HOUR:-3}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      TZ: ${TZ:-Europe/Kyiv}
    volumes:
      - ./backups:/backups
      - ./docker/backup.sh:/usr/local/bin/backup.sh:ro
    depends_on:
      db:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    security_opt:
      - no-new-privileges:true
    networks: [finance]
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

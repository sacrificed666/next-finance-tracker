<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <!-- the app's brand gradient: spring green travelling from mint to money
         green, matching the accent-grad token on the same 135deg diagonal the
         CSS uses. The fill does not change with the theme, so neither does this. -->
    <linearGradient id="g" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#03f0a6"/>
      <stop offset="1" stop-color="#01a542"/>
    </linearGradient>
    <!-- the sheen the app draws across its own gradient surfaces -->
    <linearGradient id="s" x1="0" y1="0" x2="0" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity="0.3"/>
      <stop offset="0.55" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="9" fill="url(#g)"/>
  <rect width="32" height="32" rx="9" fill="url(#s)"/>
  <!-- near-black glyph, like every label on a bright brand fill: white on this
       green is 2.2:1 and unreadable at tab size -->
  <text x="16" y="16.5" text-anchor="middle" dominant-baseline="central"
        font-family="'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700"
        fill="#07130c">&#8372;</text>
</svg>

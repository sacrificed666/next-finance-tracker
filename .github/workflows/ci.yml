name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    name: Types, lint, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint src e2e
      - run: npm test
      - run: npx next build
        env:
          AUTH_SECRET: ci-build-only

  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    needs: checks
    services:
      db:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: finance
          POSTGRES_PASSWORD: finance
          POSTGRES_DB: finance_tracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finance -d finance_tracker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://finance:finance@localhost:5432/finance_tracker
      AUTH_URL: http://localhost:3000
      AUTH_TRUST_HOST: "true"
      E2E_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Throwaway secrets for this run
        run: |
          echo "AUTH_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          echo "DATA_ENCRYPTION_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - run: npx next build
      - name: Start the production server
        run: |
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public
          (cd .next/standalone && PORT=3000 HOSTNAME=127.0.0.1 nohup node server.js > "$GITHUB_WORKSPACE/server.log" 2>&1 &)
          for i in $(seq 1 60); do curl -sf http://localhost:3000/login > /dev/null && exit 0; sleep 1; done
          cat "$GITHUB_WORKSPACE/server.log"
          exit 1
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-report
          path: |
            playwright-report
            test-results
            server.log
          retention-days: 7
